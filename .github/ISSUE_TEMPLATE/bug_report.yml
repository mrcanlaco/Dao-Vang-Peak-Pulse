name: 🐛 Bug Report
description: Report a bug, malfunction, or unexpected behavior in DAO VANG
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and fix it.
  - type: input
    id: version
    attributes:
      label: DAO VANG Version / Git Commit Hash
      placeholder: "e.g. main branch commit abc1234 or v1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System / Environment
      options:
        - Windows
        - Linux (Ubuntu/Debian)
        - macOS
        - Docker / Docker Compose
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: "When running the live scanner, I noticed..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to trigger the behavior.
      placeholder: |
        1. Run command '...'
        2. Set config '...'
        3. See error '...'
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Terminal Output
      description: Please paste sanitized logs (make sure no API tokens or keys are included!).
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have verified that this is not a duplicate of an existing issue.
          required: true
        - label: I have confirmed that no secrets or API keys are present in this report.
          required: true
