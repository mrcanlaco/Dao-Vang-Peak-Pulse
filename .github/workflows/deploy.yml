name: Deploy to Google Cloud (Live)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dao-vang-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the exact revision that passed CI
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          GCP_SSH_KEY: ${{ secrets.GCP_SSH_KEY }}
        if: env.GCP_SSH_KEY != ''
        with:
          host: ${{ secrets.GCP_HOST || '136.110.29.208' }}
          username: ${{ secrets.GCP_USER || 'ubuntu' }}
          key: ${{ secrets.GCP_SSH_KEY }}
          envs: DEPLOY_SHA
          timeout: 120s
          command_timeout: 15m
          script: |
            set -eu
            cd /home/ubuntu/dao_vang
            test -z "$(git status --porcelain --untracked-files=no)" || {
              echo "Deployment stopped: preserve and review local changes first."
              exit 1
            }
            git fetch origin main --prune
            git merge --ff-only "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            docker compose build
            docker compose up -d --no-build --wait --wait-timeout 180
            curl --fail --silent --show-error http://localhost:8000/api/health
