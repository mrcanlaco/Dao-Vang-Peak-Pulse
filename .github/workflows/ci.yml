name: CI

on:
  push:
    branches: ["main", "sprint/*"]
  pull_request:
    branches: ["main", "sprint/*"]

jobs:
  backend-tests:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libatomic1 libgomp1
          
      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev
        
      - name: Check formatting and linting
        run: uv run --frozen ruff check .
        
      - name: Type checking
        # Release-critical runtime boundaries must remain type-clean.
        run: >-
          uv run --frozen pyright
          src/dao_vang/config/settings.py
          src/dao_vang/updater/manager.py
          src/dao_vang/scoring/frozen_inference.py
          src/dao_vang/scoring/engine_comparison.py
          src/dao_vang/scanner/healthcheck.py
          src/dao_vang/web/api_server.py
          src/dao_vang/web/ai_analyst.py
          src/dao_vang/web/version_history.py

      - name: Validate operational scripts
        run: >-
          bash -n
          scripts/backup_to_gdrive.sh
          scripts/install_production_cron.sh
          scripts/prepare_runtime_permissions.sh
          scripts/prune_old_data.sh
          scripts/restore_from_gdrive.sh
        
      - name: Run unit & integration tests
        run: >-
          uv run --frozen pytest
          -ra
          --tb=short
          --junitxml=test-results/backend-tests.xml

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results/backend-tests.xml
          if-no-files-found: warn

  frontend-tests:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and Typecheck
        run: npm run build

      - name: Enforce bundle budgets
        run: npm run check:bundle

      - name: Install Chromium for browser smoke
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke
        run: npm run test:smoke
