name: CI

on:
  push:
    branches: ["main", "sprint/*"]
  pull_request:
    branches: ["main", "sprint/*"]

jobs:
  backend-tests:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"
          
      - name: Install dependencies
        run: uv sync --all-extras --dev
        
      - name: Check formatting and linting
        run: uv run ruff check .
        
      - name: Type checking
        # Keep the release gate focused while the legacy pandas-heavy scripts
        # are migrated to typed boundaries in a separate cleanup.
        run: >-
          uv run pyright
          src/dao_vang/config/settings.py
          src/dao_vang/updater/manager.py
          src/dao_vang/scoring/frozen_inference.py
          src/dao_vang/web/version_history.py
        
      - name: Run unit & integration tests
        run: uv run pytest

  frontend-tests:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and Typecheck
        run: npm run build
