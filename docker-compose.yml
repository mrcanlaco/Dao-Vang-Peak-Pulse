# ============================================================
# Đảo Vàng — Docker Compose
# ============================================================
# Đảo Vàng — Docker Compose
# 2 services:
#   scanner: bộ quét 24/7 (poll Binance → score → Telegram alert)
#   web:     API server + React frontend (api_server.py port 8000)
# Shared volumes: data (DuckDB) + artifacts (frozen models)
# ============================================================

services:
  scanner:
    build: .
    container_name: dao_vang_scanner
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - DAO_VANG_PATHS__DATA_DIR=/app/data
      - DAO_VANG_PATHS__RAW_DIR=/app/data/raw
      - DAO_VANG_PATHS__NORMALIZED_DIR=/app/data/normalized
      - DAO_VANG_SCANNER__DB_PATH=/app/data/live.duckdb
      - DAO_VANG_SCANNER__WATCHLIST_PATH=/app/data/watchlist.json
      - DAO_VANG_SCANNER__KILL_SWITCH_PATH=/app/data/scanner_kill_switch.json
      - DAO_VANG_SCANNER__ROLLBACK_STATE_PATH=/app/data/scanner_rollback.json
      - DAO_VANG_SCANNER__HEALTH_REPORT_PATH=/app/data/scanner_health.json
      - DAO_VANG_SCANNER__POLL_INTERVAL_MINUTES=5
      - DAO_VANG_SCANNER__MAX_COINS=150
      - DAO_VANG_SCANNER__SCAN_MODE=gainers
      - DAO_VANG_SCANNER__MIN_PRICE_CHANGE_PCT=5
      - DAO_VANG_SCANNER__INCLUDE_BTC=true
      - DAO_VANG_SCANNER__EXCLUDE_STABLECOINS=true
      - DAO_VANG_COINGECKO__ENABLED=false
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./configs:/app/configs
    command: >
      dao-vang scanner start --config configs/live.yaml
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  web:
    build: .
    container_name: dao_vang_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - DAO_VANG_WEB__PORT=8000
      - DAO_VANG_PATHS__DATA_DIR=/app/data
      - DAO_VANG_PATHS__RAW_DIR=/app/data/raw
      - DAO_VANG_PATHS__NORMALIZED_DIR=/app/data/normalized
      - DAO_VANG_SCANNER__DB_PATH=/app/data/live.duckdb
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./configs:/app/configs
    depends_on:
      - scanner
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
