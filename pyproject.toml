[project]
name = "dao-vang"
version = "0.1.0"
description = "Đảo Vàng - Predictive model for crypto distribution phases"
authors = [{name = "Integrator"}]
requires-python = "==3.12.*"
dependencies = [
    "pydantic-core==2.46.4",
    "pydantic-settings==2.14.2",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
    "structlog==26.1.0",
    "typer>=0.27.0",
    "pyarrow>=15.0.0",
    "duckdb>=1.0.0",
    "pytz>=2024.1",
    "streamlit>=1.30.0",
    "scikit-learn>=1.9.0",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
]

[project.scripts]
dao-vang = "dao_vang.cli.main:app"
dao-vang-ui = "dao_vang.web.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "pyright>=1.1.0",
    "tzdata>=2024.1",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
