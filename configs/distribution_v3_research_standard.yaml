schema_version: outcome_contract_v1
version: distribution_short_v3_policy_48h
engine_version: policy_path_v3.1
status: research_standard
live_eligible: false

objective:
  direction: short
  horizon_hours: 48
  success_target_from_weighted_average: 0.20
  hard_stop_from_weighted_average: 0.16
  same_bar_policy: stop_first
  fees_and_slippage_round_trip: 0.002
  include_realized_funding: true
  cost_per_side_on_traded_notional: 0.001
  bar_minutes: 5
  funding_coverage_attestation_required: true

primary_outcome:
  type: policy_aware_trade_outcome
  policy_id: timing_compact_v1
  success: target_before_stop_within_horizon
  timeout: mark_to_market_at_48h
  incomplete: exclude_and_report
  ambiguous: count_as_stop

diagnostic_outcome:
  type: entry1_price_path
  purpose: separate_signal_quality_from_execution_effect
  target_drawdown: 0.20
  max_adverse_excursion: 0.16

candidate_universe:
  min_price_return_24h: 0.15
  exclude_stablecoins: true
  point_in_time_only: true

timing_policy:
  version: challenger_reference_v3.1
  min_peak_price_return_24h: 0.30
  min_episode_age_hours: 4
  consecutive_confirmations: 2
  model_probability_threshold: 0.39
  post_confirmation_score_tolerance: 0.10
  score_interpretation: reference_only_not_v3_calibrated_probability
  max_confirmation_gap_minutes: 90
  confirmation_latched_within_episode: true
  peak_observed_since_score_armed: true
  cooldown_suppressed_entry_consumes_episode: true
  episode_gap_hours: 6
  symbol_cooldown_hours: 24
  max_entry1_per_episode: 1

execution_policy:
  policy_id: timing_compact_v1
  entry_offsets_from_entry1: [0.00, 0.03, 0.06]
  allocation_weights: [0.20, 0.30, 0.50]
  allocation_basis: notional_budget
  weighted_average_formula: sum_notional_divided_by_sum_quantity
  scale_in_window_hours: 6
  rebase_target_after_each_fill: true
  rebase_stop_after_each_fill: true
  intrabar_rule: old_stop_first_then_old_target_then_adds_then_close
  known_open_gap_precedes_intrabar_rule: true
  funding_rule: settle_at_bar_open_before_orders;exclude_entry1_time

strategy_lanes:
  - lane_id: v3_parent_challenger
    role: baseline
    additional_gate: none
  - lane_id: v3_funding_exhaustion_scout
    role: alpha_scout
    additional_gate:
      funding_percentile_30d_gte: 0.80
      funding_persistence_7d_gt: 0.0
      funding_change_8h_gt: 0.0

evidence_protocol:
  event_key: symbol_feature_time_policy_version
  embargo_hours: 48
  identical_row_comparison: true
  store_candidate_and_suppressed_events: true
  store_fill_ledger: true
  store_weighted_average_revisions: true
  report_join_and_path_coverage: true
  opened_periods_cannot_promote: true

promotion_gates:
  minimum_future_resolved_events: 100
  minimum_chronological_windows: 3
  minimum_target_rate: 0.50
  minimum_episode_recall: 0.10
  wilson_95_lower_above: 0.45
  actual_path_ev_positive: true
  conservative_ev_positive: true
  paired_ev_lower_confidence_bound_positive: true
  maximum_ece: 0.05
  separate_live_approval: true

compatibility:
  preserve_distribution_short_v1: true
  preserve_distribution_short_v2_24h: true
  do_not_relabel_historical_versions: true
  production_config_unchanged: true
