    <script>
      // Force Clear Cache & Hard Reload function
      window.forceClearCacheAndReload = function() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) regs[i].unregister();
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            for (var i = 0; i < keys.length; i++) caches.delete(keys[i]);
          });
        }
        try {
          sessionStorage.clear();
          localStorage.removeItem('dao_vang_pwa_cache');
        } catch(e) {}
        window.location.reload(true);
      };

      // Auto recovery: If a JS bundle fails to load due to stale cache/hash mismatch, unregister SW, clear cache and reload
      window.addEventListener('error', function(e) {
        var target = e.target;
        if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
          var src = target.src || target.href || '';
          if (src.indexOf('/assets/') !== -1) {
            var retryKey = 'chunk_reload_' + src;
            if (!sessionStorage.getItem(retryKey)) {
              sessionStorage.setItem(retryKey, '1');
              window.forceClearCacheAndReload();
            }
          }
        }
      }, true);

      // Timeout diagnostic fallback: If React does not mount within 4s, provide recovery UI
      setTimeout(function() {
        var root = document.getElementById('root');
        var placeholder = document.getElementById('initial-loading-box');
        if (root && placeholder && root.contains(placeholder)) {
          var retryBtn = document.getElementById('loading-retry-btn');
          if (retryBtn) {
            retryBtn.style.display = 'inline-flex';
          }
        }
      }, 4000);

    <script>

        window.addEventListener('load', () => {
