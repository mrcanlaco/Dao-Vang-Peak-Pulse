<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bản mẫu bảng phân tích</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-200 p-8 font-sans">
  
  <div class="max-w-5xl mx-auto bg-slate-900/80 border border-slate-800 rounded-xl p-4 flex flex-col gap-4">
    <div class="border-b border-slate-800 pb-2">
      <h2 class="text-amber-500 font-bold">Bảng phân tích (Mới - Tối giản)</h2>
    </div>

    <!-- HERO CARD -->
    <div class="bg-gradient-to-br from-slate-950 to-slate-900 border border-slate-800 rounded-xl p-6 flex flex-col md:flex-row items-center justify-between gap-6">
      
      <div class="flex items-center gap-4">
         <div class="w-14 h-14 rounded-full bg-amber-500/10 border border-amber-500/30 flex items-center justify-center shrink-0">
           <span class="text-amber-400 font-black text-lg">BMT</span>
         </div>
         <div>
           <div class="text-2xl font-black text-slate-100 flex items-center gap-2">BMTUSDT <span class="px-2 py-0.5 text-[10px] font-bold bg-emerald-950 text-emerald-400 border border-emerald-800 rounded">✓ TRÚNG</span></div>
           <div class="text-xl font-bold text-amber-400 font-mono mt-1">$0.45321</div>
         </div>
      </div>

      <div class="flex items-center gap-8">
        <div class="text-center">
          <div class="text-xs text-slate-400 uppercase mb-1">XÁC SUẤT XẢ (AI)</div>
          <span class="text-4xl font-black text-red-400 font-mono">85.2<span class="text-xl text-slate-500">/100</span></span>
        </div>
        <div class="text-center">
           <div class="text-xs text-slate-400 uppercase mb-2">MỨC RỦI RO</div>
           <span class="px-3 py-1.5 text-sm font-bold rounded border bg-red-950 text-red-400 border-red-800">CỰC CAO</span>
        </div>
      </div>

      <div class="flex flex-col gap-2 min-w-[200px]">
         <button class="w-full px-4 py-2.5 bg-sky-600 hover:bg-sky-500 text-white font-bold rounded-lg text-sm flex items-center justify-center gap-2 transition">
            Bắn Telegram
         </button>
         <button class="w-full px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg text-sm flex items-center justify-center transition">
            Chạy lại chấm điểm (Cập nhật mới)
         </button>
         <div class="flex gap-2 w-full">
           <button class="px-3 py-2 bg-slate-800 hover:bg-amber-950 text-slate-300 border border-slate-700 font-bold rounded-lg text-xs flex items-center justify-center flex-1 transition">
             Theo dõi
           </button>
           <button class="px-3 py-2 bg-slate-800 hover:bg-red-950 text-slate-300 border border-slate-700 font-bold rounded-lg text-xs flex items-center justify-center flex-1 transition">
             Ẩn
           </button>
         </div>
      </div>
    </div>

    <!-- METRICS -->
    <div class="bg-slate-950/90 border border-slate-800 rounded-xl p-4">
       <div class="grid grid-cols-5 gap-3 mb-4">
           <div class="bg-slate-900 p-3 rounded-lg border border-slate-800 text-center"><div class="text-xs text-slate-400 uppercase mb-1">OI 24h</div><div class="font-mono font-bold text-lg text-red-400">-12.4%</div></div>
           <div class="bg-slate-900 p-3 rounded-lg border border-slate-800 text-center"><div class="text-xs text-slate-400 uppercase mb-1">Phí funding</div><div class="font-mono font-bold text-lg text-amber-400">0.01%</div></div>
           <div class="bg-slate-900 p-3 rounded-lg border border-slate-800 text-center"><div class="text-xs text-slate-400 uppercase mb-1">Bán chủ động</div><div class="font-mono font-bold text-lg text-slate-200">55.2%</div></div>
           <div class="bg-slate-900 p-3 rounded-lg border border-slate-800 text-center"><div class="text-xs text-slate-400 uppercase mb-1">RSI 15m</div><div class="font-mono font-bold text-lg text-emerald-400">28.4</div></div>
           <div class="bg-slate-900 p-3 rounded-lg border border-slate-800 text-center"><div class="text-xs text-slate-400 uppercase mb-1">Mục tiêu -8%</div><div class="font-mono font-bold text-lg text-red-400">$0.41695</div></div>
       </div>

       <div class="flex justify-between items-center mb-3">
         <div class="text-sm font-bold text-slate-200 uppercase">BIỂU ĐỒ NẾN</div>
         <button class="text-xs px-3 py-1.5 bg-slate-800 text-slate-300 rounded hover:bg-slate-700">
           Hiện OI/phí funding (mặc định ẩn)
         </button>
       </div>
       
       <div class="h-64 bg-slate-900 rounded border border-slate-800 flex items-center justify-center text-slate-500">
         [Biểu đồ Nến (TradingView) ở đây]
       </div>
    </div>

    <!-- TOGGLE -->
    <button class="w-full py-3 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-lg text-sm font-bold text-slate-400 transition">
      Hiển thị phân tích chuyên sâu (SHAP, điểm số 8 thành phần, mẫu hình tăng nóng) ⬇
    </button>
  </div>

</body>
</html>
